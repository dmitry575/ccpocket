# CC Pocket bridge: TLS termination for the WebSocket bridge
# (the bridge itself listens on 127.0.0.1:8765, plain ws)
server {
    listen 8766 ssl;
    listen [::]:8766 ssl;
    http2 off;
    server_name 167.104.102.253;

    ssl_certificate     /root/cert/ip/fullchain.pem;
    ssl_certificate_key /root/cert/ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 600m;
    access_log /var/log/nginx/ccpocket-bridge.access.log;
    error_log  /var/log/nginx/ccpocket-bridge.error.log;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
