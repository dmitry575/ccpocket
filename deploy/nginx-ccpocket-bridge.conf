# CC Pocket bridge: TLS termination for the WebSocket bridge
# (the bridge itself listens on 127.0.0.1:8765, plain ws).
#
# Hardening notes (2026-10-22 security review):
# - the bridge checks BRIDGE_API_KEY only on the WebSocket upgrade; its HTTP
#   routes /usage and /doctor are kept closed here as defense in depth;
#   the bridge itself requires the key on them and on /api/gallery*.
# - the key travels in the query string (?token=), so the access log must not
#   record the query string;
# - connection/request limits blunt key brute force (there is no limit in the bridge).

limit_conn_zone $binary_remote_addr zone=ccp_conn:1m;
limit_req_zone  $binary_remote_addr zone=ccp_req:1m rate=10r/s;
log_format ccp_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8766 ssl;
    listen [::]:8766 ssl;
    http2 off;
    server_name 167.104.102.253;

    ssl_certificate     /root/cert/ip/fullchain.pem;
    ssl_certificate_key /root/cert/ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ccp_ssl:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    client_max_body_size 600m;
    access_log /var/log/nginx/ccpocket-bridge.access.log ccp_noquery;
    error_log  /var/log/nginx/ccpocket-bridge.error.log;

    limit_conn ccp_conn 20;
    limit_req  zone=ccp_req burst=40 nodelay;

    # Unauthenticated bridge HTTP routes: closed from the outside.
    location = /usage  { return 403; }
    location = /doctor { return 403; }
    # /api/gallery* is key-protected by the bridge itself since the fork fix.

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
